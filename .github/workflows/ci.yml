name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_EXTENSIONS: mbstring, dom, fileinfo, gd, intl, pdo_mysql, zip, sodium, curl, ctype, filter, xml, redis

jobs:
  lint:
    name: Lint & coding standard (PHPCS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.3-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.3-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPCS
        run: composer cs-check

  static-analysis:
    name: Static analysis (PHPStan + Psalm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.3-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.3-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPStan
        run: composer phpstan

      - name: Psalm
        run: composer psalm

  rector:
    name: Rector (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.3-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.3-

      - run: composer install --no-interaction --no-progress --prefer-dist

      # Fails the build if Rector would still change anything - i.e. any
      # already-applied refactoring/upgrade rule regressed, or new code
      # introduced something Rector's rule set would flag.
      - name: Rector
        run: composer rector

  tests:
    name: Unit tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php-version }}-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPUnit with coverage
        run: composer test-coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-php${{ matrix.php-version }}
          path: var/coverage
          retention-days: 14

  # Integration suite: a real Shopware 6.7 (fresh shopware/production project
  # with this plugin as a path repository) + MySQL + Dex. Written without a
  # Docker environment and not yet run — continue-on-error until it has
  # passed once (see tests/Integration/README.md), then remove that line.
  integration:
    name: Integration tests (Shopware 6.7 + Dex)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      SHOPWARE_PROJECT_ROOT: ${{ github.workspace }}/shop
      APP_URL: http://localhost:8000
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/shopware
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Start Dex
        run: docker compose -f plugin/tests/Integration/docker-compose.yml up -d --wait

      - name: Create Shopware project with the plugin
        run: |
          composer create-project shopware/production:~6.7.0 shop --no-interaction --no-progress --no-scripts
          cd shop
          composer config repositories.sw6oidc '{"type": "path", "url": "../plugin", "options": {"symlink": true}}'
          composer require 'martinkuhl/shopware6-oidc-sso:*' --no-interaction --no-progress --no-scripts
          composer require --dev 'phpunit/phpunit:^11.5' symfony/browser-kit --no-interaction --no-progress --no-scripts
          {
            echo "APP_ENV=test"
            echo "APP_URL=${APP_URL}"
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "APP_SECRET=$(openssl rand -hex 32)"
            echo "INSTANCE_ID=$(openssl rand -hex 16)"
          } > .env.local

      - name: Integration suite
        working-directory: plugin
        run: composer test-integration
